<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-icon">☼</div>
          <div>
            <p class="eyebrow">Weather</p>
            <h1>Dashboard</h1>
          </div>
        </div>

        <div class="toolbar">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
            <span class="toggle-icon">🌙</span>
          </button>

          <form id="searchForm" class="search-form" autocomplete="off">
            <label class="sr-only" for="cityInput">Search city</label>
            <input
              id="cityInput"
              name="city"
              type="text"
              placeholder="Search city..."
              aria-label="Search city"
            />
            <button type="submit">Search</button>
          </form>
        </div>
      </header>

      <main class="weather-layout">
        <section class="weather-card current-weather" aria-live="polite">
          <div class="status-row">
            <span id="locationName" class="location-name">Loading...</span>
            <span id="currentDate" class="muted"></span>
          </div>

          <div class="temp-row">
            <div id="weatherIcon" class="weather-icon" aria-hidden="true">☀️</div>
            <div>
              <div id="temperature" class="temperature">--°</div>
              <div id="weatherDescription" class="weather-description">Fetching weather...</div>
            </div>
          </div>

          <div class="metrics-grid">
            <div class="metric">
              <span class="label">Feels like</span>
              <strong id="feelsLike">--°</strong>
            </div>
            <div class="metric">
              <span class="label">Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="metric">
              <span class="label">Wind</span>
              <strong id="windSpeed">-- km/h</strong>
            </div>
            <div class="metric">
              <span class="label">Precipitation</span>
              <strong id="precipitation">-- mm</strong>
            </div>
          </div>
        </section>

        <aside class="weather-card additional-card">
          <h2>Today</h2>
          <div class="detail-list">
            <div class="detail-item">
              <span>Sunrise</span>
              <strong id="sunrise">--:--</strong>
            </div>
            <div class="detail-item">
              <span>Sunset</span>
              <strong id="sunset">--:--</strong>
            </div>
            <div class="detail-item">
              <span>High</span>
              <strong id="highTemp">--°</strong>
            </div>
            <div class="detail-item">
              <span>Low</span>
              <strong id="lowTemp">--°</strong>
            </div>
          </div>
        </aside>
      </main>

      <section class="weather-card hourly-card">
        <div class="section-header">
          <h2>Hourly Forecast</h2>
        </div>
        <div id="hourlyForecast" class="hourly-list" aria-live="polite"></div>
      </section>

      <section class="weather-card forecast-card">
        <div class="forecast-header">
          <h2>5-Day Forecast</h2>
          <div class="unit-toggle" aria-label="Temperature unit toggle">
            <button class="unit-button active" data-unit="celsius" type="button">°C</button>
            <button class="unit-button" data-unit="fahrenheit" type="button">°F</button>
          </div>
        </div>
        <div id="forecastList" class="forecast-list" aria-live="polite"></div>
      </section>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
